version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: team-hearing-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: musiclovers
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - team-hearing-network
    command: --default-authentication-plugin=mysql_native_password

  # Backend Application
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: team-hearing-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/musiclovers?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - team-hearing-network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  team-hearing-network:
    driver: bridge

